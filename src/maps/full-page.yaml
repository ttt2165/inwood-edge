# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
type: map
id: full-page
config:
  mapStyle: "/style.json"
  center: [-73.9195, 40.8630]
  zoom: 15

legend:
  position: bottom-left

layers:
  - id: landuse
    type: fill
    label: Land use today
    source:
      type: geojson
      url: "/data/landuse_today.geojson"
    classify:
      field: cls
      categories:
        Housing: "#f2d388"
        "Commercial, public & parking": "#e8896b"
        Industrial: "#9b6fb0"
        "Transportation & utility": "#a7a7a7"
        "Parks & open space": "#8cc084"
        "Vacant or undeveloped": "#e9e4d8"
      other: "#dddddd"
    paint:
      fill-opacity: 0.75
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: cls
          - p:
              - str: "Land use: "
              - property: use
          - p:
              - str: "Lot size (acres): "
              - property: acres

  - id: fema
    type: fill
    label: FEMA 1% flood zone (today)
    source:
      type: geojson
      url: "/data/fema_1pct_AE.geojson"
    paint:
      fill-color: "#2b7bba"
      fill-opacity: 0.35
    legend: { label: FEMA 1% flood zone, color: "#2b7bba", shape: square }

  - id: flood-2080s
    type: line
    label: 2080s 100-year floodplain
    visible: false
    source:
      type: geojson
      url: "/data/flood_2080s_100yr.geojson"
    paint:
      line-color: "#08306b"
      line-width: 2
      line-dasharray: [2, 1]
    legend: { label: 2080s 100-year floodplain, color: "#08306b", shape: line }

  - id: shoreline-1924
    type: line
    label: 1924 shoreline
    source:
      type: geojson
      url: "/data/shoreline_1924.geojson"
    paint:
      line-color: "#c0392b"
      line-width: 2.5
    legend: { label: 1924 shoreline, color: "#c0392b", shape: line }

  - id: study-area
    type: line
    label: Study area
    source:
      type: geojson
      url: "/data/study_area.geojson"
    paint:
      line-color: "#333333"
      line-width: 1.5
      line-dasharray: [4, 2]
    legend: { label: Study area, color: "#333333", shape: line }

  - id: schools
    type: circle
    label: Schools (K-12)
    source:
      type: geojson
      url: "/data/schools.geojson"
    paint:
      circle-radius: 5
      circle-color: "#ffffff"
      circle-stroke-color: "#222222"
      circle-stroke-width: 1.5
    legend: { label: Schools (K-12), color: "#222222", shape: circle }
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: FACNAME
          - p:
              - property: ADDRESS
